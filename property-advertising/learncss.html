<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn CSS</title>
    <style>
        p {
            background-color: green;
            font-size: 50px;
            color: white;
            font-weight: 700;
            text-align: center;
        }

        #para2 {
            color: red;
        }
    </style>
    <link rel="stylesheet" href="learncss.css">
</head>
<body>
    <h1>The Heading</h1>
    <p style="background-color: yellow;">The paragraph</p>
    <p id="para2">Another paragraph 1</p>
    <p>Another Paragraph 2 which is slightly larger content</p>
</body>
</html>
